<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS Cemetery Map & Proximity Finder - Find a Grave Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding: 1.5rem; min-height: 100vh; }
        .container { max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }

        .btn {
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary { background-color: var(--border-color); color: var(--text-primary); }
        .btn-green { background-color: var(--accent-green); color: #fff; }

        .toolbar-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            box-shadow: var(--shadow);
        }

        .filter-group { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; flex: 1; }

        input[type="text"], input[type="number"], select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }

        .map-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            position: relative;
            height: calc(100vh - 220px);
            min-height: 620px;
        }

        #gisMap { width: 100%; height: 100%; z-index: 1; }

        .status-badge {
            position: absolute;
            top: 1rem; right: 1rem;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.5rem 0.8rem;
            font-size: 0.8rem;
            z-index: 1000;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Top Navigation Bar -->
        <nav class="main-navbar" style="display: flex; align-items: center; justify-content: space-between; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 0.75rem 1.5rem; box-shadow: var(--shadow);">
            <div class="nav-brand">
                <a href="/" style="text-decoration: none; color: var(--text-primary); font-weight: 700; font-size: 1.15rem; display: flex; align-items: center; gap: 0.5rem;">
                    <span>🪦 Find a Grave Tools</span>
                    <span style="font-size: 0.7rem; background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); padding: 0.15rem 0.4rem; border-radius: 4px; border: 1px solid rgba(59, 130, 246, 0.3);">v2.5</span>
                </a>
            </div>
            <div class="nav-links" style="display: flex; align-items: center; gap: 0.5rem; background: rgba(15, 23, 42, 0.5); padding: 0.35rem; border-radius: 10px; border: 1px solid var(--border-color);">
                <a href="/" style="text-decoration: none; color: var(--text-secondary); font-weight: 500; font-size: 0.9rem; padding: 0.45rem 1rem; border-radius: 8px;">📊 Dashboard</a>
                <a href="/tree" style="text-decoration: none; color: var(--text-secondary); font-weight: 500; font-size: 0.9rem; padding: 0.45rem 1rem; border-radius: 8px;">🌳 Family Tree</a>
                <a href="/map" style="text-decoration: none; color: #fff; background: var(--accent-blue); font-weight: 600; font-size: 0.9rem; padding: 0.45rem 1rem; border-radius: 8px;">🗺️ GIS Cemetery Map</a>
                <a href="/analytics" style="text-decoration: none; color: var(--text-secondary); font-weight: 500; font-size: 0.9rem; padding: 0.45rem 1rem; border-radius: 8px;">📈 Analytics</a>
                <a href="/quality" style="text-decoration: none; color: var(--text-secondary); font-weight: 500; font-size: 0.9rem; padding: 0.45rem 1rem; border-radius: 8px;">🔍 Data Quality</a>
            </div>
            <div>
                <button class="btn btn-secondary btn-small" id="resetMapBtn">🔄 Reset View</button>
            </div>
        </nav>

        <!-- Map Toolbar -->
        <div class="toolbar-card" style="display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: space-between; align-items: center;">
            <div class="filter-group" style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                <select id="mapCemSelect" style="min-width: 180px;">
                    <option value="all">📍 All Cemeteries (Overview)</option>
                </select>

                <input type="text" id="mapSurnameInput" placeholder="Filter Surname..." style="width: 150px;" />

                <div style="display: flex; align-items: center; gap: 0.4rem; background: rgba(15, 23, 42, 0.5); padding: 0.25rem 0.5rem; border-radius: 6px; border: 1px solid var(--border-color);">
                    <input type="text" id="mapFocusIdInput" placeholder="Focus ID..." style="width: 110px;" />
                    <input type="number" id="mapRadiusInput" value="100" min="10" max="5000" style="width: 65px;" title="Radius in feet" />
                    <span style="font-size: 0.75rem; color: var(--text-secondary);">ft</span>
                    <button class="btn btn-green btn-small" id="findNearbyBtn">🎯 Proximity</button>
                </div>
            </div>

            <!-- Kinship Map Mode Control -->
            <div style="display: flex; align-items: center; gap: 0.4rem; background: rgba(139, 92, 246, 0.15); padding: 0.35rem 0.65rem; border-radius: 8px; border: 1px solid rgba(139, 92, 246, 0.3);">
                <span style="font-size: 0.8rem; font-weight: 600; color: #a78bfa;">👨‍👩‍👧 Kinship Map:</span>
                <input type="text" id="mapKinshipIdInput" placeholder="Focus Person ID..." style="width: 120px;" />
                <select id="mapKinshipGenSelect" style="width: 75px;">
                    <option value="1">1 Gen</option>
                    <option value="2">2 Gens</option>
                    <option value="3" selected>3 Gens</option>
                    <option value="4">4 Gens</option>
                </select>
                <button class="btn btn-small" id="mapKinshipBtn" style="background: #8b5cf6; color: #fff; font-weight: 600;">👨‍👩‍👧 Map Family</button>
            </div>
        </div>

        <!-- Map Canvas with Floating Legend -->
        <div class="map-card" style="position: relative;">
            <div class="status-badge" id="mapStatusText">Loading map pins...</div>
            
            <!-- Kinship Map Legend Overlay -->
            <div id="kinshipLegend" style="display: none; position: absolute; bottom: 20px; left: 20px; z-index: 1000; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border: 1px solid var(--border-color); border-radius: 10px; padding: 0.6rem 0.9rem; font-size: 0.75rem; color: #fff; box-shadow: var(--shadow);">
                <div style="font-weight: 700; margin-bottom: 0.4rem; color: #a78bfa;">👨‍👩‍👧 Family Kinship Map Legend</div>
                <div style="display: flex; gap: 0.8rem; flex-wrap: wrap;">
                    <span><span style="color: #f59e0b;">⭐</span> Focus Person</span>
                    <span><span style="color: #3b82f6;">💙</span> Parents / Ancestors</span>
                    <span><span style="color: #ec4899;">🩷</span> Spouses</span>
                    <span><span style="color: #10b981;">💚</span> Children / Descendants</span>
                    <span><span style="color: #8b5cf6;">💜</span> Siblings</span>
                </div>
            </div>

            <div id="gisMap"></div>
        </div>
    </div>

    <script>
        let leafletMap = null;
        let mapMarkersGroup = null;
        let proximityCircle = null;

        const urlParams = new URLSearchParams(window.location.search);
        const paramCemetery = urlParams.get('cemetery');
        const paramFocus = urlParams.get('focus');

        // Tile layers
        const satelliteTile = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        const streetTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        });

        function initMap() {
            leafletMap = L.map('gisMap', {
                center: [39.8283, -98.5795], // Center US default
                zoom: 4,
                layers: [satelliteTile]
            });

            L.control.layers({
                "📡 Satellite Aerial View": satelliteTile,
                "🗺️ Street Map": streetTile
            }).addTo(leafletMap);

            mapMarkersGroup = L.layerGroup().addTo(leafletMap);
        }

        async function loadCemeteriesDropdown() {
            try {
                const res = await fetch('/api/cemeteries');
                const rawData = await res.json();
                const list = Array.isArray(rawData) ? rawData : (rawData.cemeteries || []);
                const sel = document.getElementById('mapCemSelect');

                list.forEach(c => {
                    if (c.gps_lat && c.gps_lng) {
                        const opt = document.createElement('option');
                        opt.value = c.id;
                        opt.textContent = `🏛️ ${c.name || c.id} (${c.burial_count || 0} burials)`;
                        sel.appendChild(opt);
                    }
                });

                if (paramCemetery) {
                    sel.value = paramCemetery;
                }
            } catch(e) {}
        }

        async function loadMapBurials() {
            if (!leafletMap) return;

            const selectedCem = document.getElementById('mapCemSelect').value;
            const surname = document.getElementById('mapSurnameInput').value.trim();
            const statusText = document.getElementById('mapStatusText');

            mapMarkersGroup.clearLayers();
            if (proximityCircle) {
                leafletMap.removeLayer(proximityCircle);
                proximityCircle = null;
            }

            statusText.textContent = 'Fetching pins...';

            if (selectedCem === 'all' && !surname) {
                // Tier 1: Plot Cemetery Pins
                try {
                    const res = await fetch('/api/map/cemeteries');
                    const rawData = await res.json();
                    const cList = Array.isArray(rawData) ? rawData : (rawData.cemeteries || []);
                    const bounds = [];

                    cList.forEach(c => {
                        const marker = L.circleMarker([c.gps_lat, c.gps_lng], {
                            radius: 10,
                            fillColor: '#8b5cf6',
                            color: '#ffffff',
                            weight: 2,
                            opacity: 1,
                            fillOpacity: 0.95
                        });

                        marker.bindPopup(`
                            <div style="color: #0f172a; font-family: Inter, sans-serif; min-width: 180px;">
                                <h4 style="margin: 0 0 4px 0; color: #6d28d9; font-size: 0.95rem;">🏛️ ${c.name || c.id}</h4>
                                <p style="margin: 0 0 6px 0; font-size: 0.8rem; color: #475569;">${c.location || 'Location unmapped'}</p>
                                <p style="margin: 0 0 8px 0; font-size: 0.8rem; font-weight: 600;">🪦 ${c.burial_count || 0} Stashed Memorials</p>
                                <button onclick="selectCemetery('${c.id}')" style="width: 100%; padding: 4px 8px; background: #8b5cf6; color: #fff; border: none; border-radius: 4px; font-weight: 600; font-size: 0.75rem; cursor: pointer;">🔍 View Memorials on Map</button>
                            </div>
                        `);

                        mapMarkersGroup.addLayer(marker);
                        bounds.push([c.gps_lat, c.gps_lng]);
                    });

                    statusText.textContent = `Showing ${cList.length} cemeteries`;
                    if (bounds.length > 0) leafletMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
                } catch(e) {
                    statusText.textContent = 'Error loading cemeteries';
                }
            } else {
                // Tier 2: Plot Individual Graves
                try {
                    let url = `/api/map/burials?cemetery_id=${selectedCem}`;
                    if (surname) url += `&surname=${encodeURIComponent(surname)}`;

                    const res = await fetch(url);
                    const rawData = await res.json();
                    const bList = Array.isArray(rawData) ? rawData : (rawData.burials || []);
                    const bounds = [];

                    bList.forEach(b => {
                        const isMatch = surname && b.surname && b.surname.toLowerCase().includes(surname.toLowerCase());
                        const color = isMatch ? '#f59e0b' : '#17a2b8';

                        const marker = L.circleMarker([b.gps_lat, b.gps_lng], {
                            radius: isMatch ? 8 : 6,
                            fillColor: color,
                            color: '#ffffff',
                            weight: 1.5,
                            opacity: 1,
                            fillOpacity: 0.9
                        });

                        marker.bindPopup(`
                            <div style="color: #0f172a; font-family: Inter, sans-serif; min-width: 180px;">
                                <h4 style="margin: 0 0 4px 0; color: #0284c7; font-size: 0.95rem;">🪦 ${b.name}</h4>
                                <p style="margin: 0 0 4px 0; font-size: 0.8rem; color: #475569;">${b.birth_date || '?'} — ${b.death_date || '?'}</p>
                                <p style="margin: 0 0 6px 0; font-size: 0.75rem; color: #64748b;">Plot: ${b.plot || 'Not specified'}</p>
                                <div style="display: flex; gap: 4px;">
                                    <a href="/tree?focus=${b.id}" style="flex: 1; text-align: center; padding: 4px; background: #3b82f6; color: #fff; text-decoration: none; border-radius: 4px; font-weight: 600; font-size: 0.7rem;">🌳 Family Tree</a>
                                    <button onclick="setFocusAndSearchProximity('${b.id}')" style="flex: 1; padding: 4px; background: #10b981; color: #fff; border: none; border-radius: 4px; font-weight: 600; font-size: 0.7rem; cursor: pointer;">🎯 Proximity</button>
                                </div>
                            </div>
                        `);

                        mapMarkersGroup.addLayer(marker);
                        bounds.push([b.gps_lat, b.gps_lng]);
                    });

                    statusText.textContent = `Showing ${bList.length} grave plots`;
                    if (bounds.length > 0) leafletMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 18 });
                } catch(e) {
                    statusText.textContent = 'Error loading graves';
                }
            }
        }

        function selectCemetery(cemId) {
            document.getElementById('mapCemSelect').value = cemId;
            loadMapBurials();
        }

        async function findNearbyGraves() {
            const focusId = document.getElementById('mapFocusIdInput').value.trim();
            const radiusFeet = parseFloat(document.getElementById('mapRadiusInput').value) || 100;
            const selectedCem = document.getElementById('mapCemSelect').value;
            const statusText = document.getElementById('mapStatusText');

            if (!focusId) { alert("Please enter a Focus Memorial ID for proximity calculation."); return; }

            try {
                let url = `/api/memorials/${focusId}/proximity?radius=${radiusFeet}`;
                if (selectedCem !== 'all') url += `&cemetery_id=${selectedCem}`;

                const res = await fetch(url);
                const data = await res.json();
                if (!res.ok || data.error) {
                    alert(data.error || "Proximity query failed.");
                    return;
                }

                mapMarkersGroup.clearLayers();
                if (proximityCircle) leafletMap.removeLayer(proximityCircle);

                const fMem = data.focus_memorial;
                const fLat = fMem.gps_lat;
                const fLng = fMem.gps_lng;

                // Plot radius circle
                const radiusMeters = radiusFeet * 0.3048;
                proximityCircle = L.circle([fLat, fLng], {
                    radius: radiusMeters,
                    color: '#ef4444',
                    fillColor: '#ef4444',
                    fillOpacity: 0.15,
                    weight: 2,
                    dashArray: '5, 5'
                }).addTo(leafletMap);

                // Focus Marker
                const focusMarker = L.circleMarker([fLat, fLng], {
                    radius: 10,
                    fillColor: '#ef4444',
                    color: '#ffffff',
                    weight: 3,
                    opacity: 1,
                    fillOpacity: 1
                });
                focusMarker.bindPopup(`<b>🎯 FOCUS: ${fMem.name}</b><br>Plot: ${fMem.plot || 'N/A'}`).addTo(mapMarkersGroup);

                const bounds = [[fLat, fLng]];

                // Nearby Grave Markers
                data.nearby_burials.forEach(b => {
                    const marker = L.circleMarker([b.gps_lat, b.gps_lng], {
                        radius: 7,
                        fillColor: '#10b981',
                        color: '#ffffff',
                        weight: 1.5,
                        opacity: 1,
                        fillOpacity: 0.95
                    });

                    marker.bindPopup(`
                        <b>🪦 ${b.name}</b><br>
                        Distance: <b>${b.distance_feet} feet</b> (${b.distance_meters}m)<br>
                        Plot: ${b.plot || 'N/A'}<br>
                        <a href="/tree?focus=${b.id}" style="color: #3b82f6; font-weight: 600;">🌳 Family Tree</a>
                    `);

                    mapMarkersGroup.addLayer(marker);
                    bounds.push([b.gps_lat, b.gps_lng]);
                });

                statusText.textContent = `Found ${data.count} graves within ${radiusFeet} ft`;
                leafletMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 19 });
            } catch(e) {
                alert("Proximity search failed: " + e.message);
            }
        }

        function setFocusAndSearchProximity(memId) {
            document.getElementById('mapFocusIdInput').value = memId;
            findNearbyGraves();
        }

        async function mapKinshipNetwork(targetFocusId = null) {
            const focusId = targetFocusId || document.getElementById('mapKinshipIdInput').value.trim();
            const gens = document.getElementById('mapKinshipGenSelect').value;
            const statusText = document.getElementById('mapStatusText');
            const legend = document.getElementById('kinshipLegend');

            if (!focusId) {
                alert("Please enter a Focus Memorial ID to map their family network.");
                return;
            }

            statusText.textContent = `Mapping family network for Memorial #${focusId}...`;

            try {
                const res = await fetch(`/api/map/kinship?focus_id=${encodeURIComponent(focusId)}&generations=${gens}`);
                const data = await res.json();

                if (!res.ok || data.error) {
                    alert(data.error || "Kinship map query failed.");
                    statusText.textContent = 'Kinship query failed';
                    return;
                }

                mapMarkersGroup.clearLayers();
                if (proximityCircle) {
                    leafletMap.removeLayer(proximityCircle);
                    proximityCircle = null;
                }

                const focusMem = data.focus_memorial;
                const relatives = data.relatives || [];
                const connections = data.connections || [];
                const mappedRelatives = relatives.filter(r => r.has_gps);

                if (mappedRelatives.length === 0) {
                    alert(`No stashed relatives with GPS coordinates found for ${focusMem.name}.`);
                    statusText.textContent = 'No GPS coordinates for relatives';
                    return;
                }

                legend.style.display = 'block';

                const roleColors = {
                    'focus': '#f59e0b',
                    'parent': '#3b82f6',
                    'spouse': '#ec4899',
                    'child': '#10b981',
                    'sibling': '#8b5cf6',
                    'relative': '#06b6d4'
                };

                const roleHearts = {
                    'focus': '💛',
                    'parent': '💙',
                    'spouse': '🩷',
                    'child': '💚',
                    'sibling': '💜',
                    'relative': '🩵'
                };

                // Create dictionary of mapped relative GPS points
                const gpsMap = {};
                mappedRelatives.forEach(r => {
                    gpsMap[r.id] = { lat: parseFloat(r.gps_lat), lng: parseFloat(r.gps_lng), role: r.role };
                });

                // 1. Draw Clean Hub-and-Spoke Flowlines from Focus Person to Relatives
                let fLat = focusMem.gps_lat ? parseFloat(focusMem.gps_lat) : null;
                let fLng = focusMem.gps_lng ? parseFloat(focusMem.gps_lng) : null;

                // Fallback: If Focus Person lacks GPS, use the first mapped relative as central hub
                if ((fLat === null || fLng === null) && mappedRelatives.length > 0) {
                    fLat = parseFloat(mappedRelatives[0].gps_lat);
                    fLng = parseFloat(mappedRelatives[0].gps_lng);
                }

                let flowlineCount = 0;
                if (fLat !== null && fLng !== null) {
                    mappedRelatives.forEach(r => {
                        const rLat = parseFloat(r.gps_lat);
                        const rLng = parseFloat(r.gps_lng);
                        
                        // Don't draw line from focus person to themselves unless it's a fallback hub
                        if (r.id !== String(focusMem.id) || (focusMem.gps_lat === null && rLat !== fLat)) {
                            const flowColor = roleColors[r.role] || '#8b5cf6';

                            const polyline = L.polyline([[fLat, fLng], [rLat, rLng]], {
                                color: flowColor,
                                weight: 2.5,
                                dashArray: '6, 8',
                                opacity: 0.85
                            });
                            mapMarkersGroup.addLayer(polyline);
                            flowlineCount++;
                        }
                    });
                }

                // 2. Render Custom Color-Coded Heart Badge Markers
                const bounds = [];
                mappedRelatives.forEach(r => {
                    const rLat = parseFloat(r.gps_lat);
                    const rLng = parseFloat(r.gps_lng);
                    bounds.push([rLat, rLng]);

                    const color = roleColors[r.role] || roleColors['relative'];
                    const heartIcon = roleHearts[r.role] || roleHearts['relative'];
                    const isFocus = (r.role === 'focus');

                    // Custom Leaflet Heart Marker Icon
                    const customIcon = L.divIcon({
                        className: 'custom-heart-marker',
                        html: `
                            <div style="
                                background: ${color};
                                color: #ffffff;
                                width: ${isFocus ? '34px' : '28px'};
                                height: ${isFocus ? '34px' : '28px'};
                                border-radius: 50%;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                font-size: ${isFocus ? '16px' : '13px'};
                                box-shadow: 0 0 12px ${color}, 0 2px 6px rgba(0,0,0,0.5);
                                border: 2px solid #ffffff;
                                cursor: pointer;
                            ">
                                ${heartIcon}
                            </div>
                        `,
                        iconSize: [isFocus ? 34 : 28, isFocus ? 34 : 28],
                        iconAnchor: [isFocus ? 17 : 14, isFocus ? 17 : 14]
                    });

                    const marker = L.marker([rLat, rLng], { icon: customIcon });

                    const popupHtml = `
                        <div style="color: #0f172a; font-family: Inter, sans-serif; min-width: 190px;">
                            <h4 style="margin: 0 0 4px 0; color: ${color}; font-size: 0.95rem;">${heartIcon} ${r.role_label}: ${r.name}</h4>
                            <p style="margin: 0 0 4px 0; font-size: 0.8rem; color: #475569;">${r.birth_date || '?'} — ${r.death_date || '?'}</p>
                            <p style="margin: 0 0 4px 0; font-size: 0.75rem; color: #64748b;">🏛️ ${r.cemetery_name} (Plot: ${r.plot || 'N/A'})</p>
                            ${r.distance_miles ? `<p style="margin: 0 0 6px 0; font-size: 0.75rem; font-weight: 600; color: #047857;">📏 ${r.distance_miles} miles away (${r.distance_feet} ft)</p>` : ''}
                            <div style="display: flex; gap: 4px;">
                                <a href="/tree?focus=${r.id}" style="flex: 1; text-align: center; padding: 4px; background: #3b82f6; color: #fff; text-decoration: none; border-radius: 4px; font-weight: 600; font-size: 0.7rem;">🌳 Family Tree</a>
                                <button onclick="mapKinshipNetwork('${r.id}')" style="flex: 1; padding: 4px; background: #8b5cf6; color: #fff; border: none; border-radius: 4px; font-weight: 600; font-size: 0.7rem; cursor: pointer;">👨‍👩‍👧 Re-Center</button>
                            </div>
                        </div>
                    `;

                    marker.bindPopup(popupHtml);
                    mapMarkersGroup.addLayer(marker);
                });

                statusText.textContent = `Mapped ${data.total_mapped} family grave sites (${flowlineCount} flowlines) for ${focusMem.name}`;
                if (bounds.length > 0) leafletMap.fitBounds(bounds, { padding: [50, 50], maxZoom: 18 });
            } catch(e) {
                alert("Kinship mapping error: " + e.message);
                statusText.textContent = 'Kinship error';
            }
        }

        const paramKinship = urlParams.get('kinship');

        document.getElementById('mapCemSelect').addEventListener('change', loadMapBurials);
        document.getElementById('mapSurnameInput').addEventListener('input', loadMapBurials);
        document.getElementById('findNearbyBtn').addEventListener('click', findNearbyGraves);
        document.getElementById('mapKinshipBtn').addEventListener('click', () => mapKinshipNetwork());
        document.getElementById('resetMapBtn').addEventListener('click', () => {
            document.getElementById('mapSurnameInput').value = '';
            document.getElementById('mapFocusIdInput').value = '';
            document.getElementById('mapKinshipIdInput').value = '';
            document.getElementById('mapCemSelect').value = 'all';
            document.getElementById('kinshipLegend').style.display = 'none';
            loadMapBurials();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            initMap();
            await loadCemeteriesDropdown();

            if (paramKinship) {
                document.getElementById('mapKinshipIdInput').value = paramKinship;
                mapKinshipNetwork(paramKinship);
            } else if (paramFocus) {
                document.getElementById('mapFocusIdInput').value = paramFocus;
                findNearbyGraves();
            } else {
                loadMapBurials();
            }
        });
    </script>
</body>
</html>
